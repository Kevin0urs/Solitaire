<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tests Unitaires - Spider Solitaire 2 Couleurs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #89b4fa;
            border-bottom: 2px solid #45475a;
            padding-bottom: 10px;
        }
        .summary {
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: #313244;
        }
        .passed-banner { color: #a6e3a1; border-left: 5px solid #a6e3a1; }
        .failed-banner { color: #f38ba8; border-left: 5px solid #f38ba8; }
        .test-case {
            margin-bottom: 12px;
            padding: 12px 16px;
            background: #181825;
            border-radius: 6px;
            border-left: 4px solid #89b4fa;
        }
        .test-case.pass { border-left-color: #a6e3a1; }
        .test-case.fail { border-left-color: #f38ba8; }
        .test-title { font-weight: bold; font-size: 1.05rem; }
        .test-status { float: right; font-weight: bold; }
        .pass-text { color: #a6e3a1; }
        .fail-text { color: #f38ba8; }
        .error-details {
            margin-top: 8px;
            padding: 8px;
            background: #313244;
            color: #f38ba8;
            font-family: monospace;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🧪 Suite de Tests Unitaires - Spider Solitaire 2 Couleurs</h1>
    <div id="summary" class="summary">Exécution des tests en cours...</div>
    <div id="test-results"></div>

    <script type="module">
        import { runAllGameEngineTests } from './game_logic.test.js';

        let totalTests = 0;
        let passedTests = 0;
        let failedTests = 0;

        const resultsContainer = document.getElementById('test-results');
        const summaryContainer = document.getElementById('summary');

        const assert = {
            test: (name, fn) => {
                totalTests++;
                const itemEl = document.createElement('div');
                itemEl.className = 'test-case';
                
                try {
                    fn();
                    passedTests++;
                    itemEl.classList.add('pass');
                    itemEl.innerHTML = `<span class="test-title">✓ ${name}</span><span class="test-status pass-text">SUCCÈS</span>`;
                } catch (err) {
                    failedTests++;
                    itemEl.classList.add('fail');
                    itemEl.innerHTML = `
                        <span class="test-title">✗ ${name}</span><span class="test-status fail-text">ÉCHEC</span>
                        <div class="error-details">${err.message}\n${err.stack || ''}</div>
                    `;
                }

                resultsContainer.appendChild(itemEl);
            },
            equal: (actual, expected, msg) => {
                if (actual !== expected) {
                    throw new Error(`Assertion failed: ${msg || ''} (Attendu: ${expected}, Obtenu: ${actual})`);
                }
            },
            notEqual: (actual, expected, msg) => {
                if (actual === expected) {
                    throw new Error(`Assertion failed: ${msg || ''} (Ne devait pas être égal à ${expected})`);
                }
            }
        };

        try {
            runAllGameEngineTests(assert);

            if (failedTests === 0) {
                summaryContainer.className = 'summary passed-banner';
                summaryContainer.innerHTML = `✅ Tous les ${passedTests} tests sont passés avec succès !`;
            } else {
                summaryContainer.className = 'summary failed-banner';
                summaryContainer.innerHTML = `❌ ${failedTests} test(s) ont échoué sur ${totalTests}.`;
            }
        } catch (e) {
            summaryContainer.className = 'summary failed-banner';
            summaryContainer.innerHTML = `⚠️ Erreur lors de l'exécution des tests: ${e.message}`;
        }
    </script>
</body>
</html>
